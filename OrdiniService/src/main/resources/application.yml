spring:
  application:
    name: OrdiniService
  kafka:
    channels:
      ordini: ordini-channel
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:sqlserver://sqlserver-db:1433;databaseName=DBMAGAZZINI;encrypt=true;trustServerCertificate=true
    username: admin
    password: magazzinetto34
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://magazzino-eureka:8761/eureka
 
apigateway:
  url: http://apigateway:8080

---
spring:
  config:
    activate:
      on-profile: dev


---
spring:
  config:
    activate:
      on-profile: "!dev"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/magazzino
      client:
        registration:
          chiama-giacenze:
            client-id: ordini-client
            client-secret: ${ORDINI_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-metod: client_secret_post
            scope: openid
        provider:
          chiama-giacenze:
            token-uri: http://keycloak:8080/realms/magazzino/protocol/openid-connect/token
         